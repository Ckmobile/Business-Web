<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Online Shop</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Shell-only styling for the tab bar -->
<link rel="stylesheet" href="css/app.css">

<!-- Firebase SDK, loaded ONCE for every page (compat build, kept at the
     version most of the original pages used: 9.23.0) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- The active page's own CSS is injected into this tag by app.js -->
<style id="page-style"></style>
</head>
<body>

<nav class="spa-tabbar">
  <button class="spa-tab" data-page="index">Home</button>
  <button class="spa-tab" data-page="list">Order List</button>
  <button class="spa-tab" data-page="cart">Cart</button>
  <button class="spa-tab" data-page="order">Order</button>
  <button class="spa-tab" data-page="orders">Orders</button>
  <button class="spa-tab" data-page="page">Product</button>
  <button class="spa-tab" data-page="profile">Profile</button>
  <button class="spa-tab" data-page="dashboard">Dashboard</button>
  <button class="spa-tab" data-page="admin">Admin</button>
  <button class="spa-tab" data-page="games">Games</button>
  <button class="spa-tab" data-page="settings">Settings</button>
</nav>

<!-- Each page's own HTML fragment is injected here by app.js -->
<div id="app-content"></div>

<script src="js/app.js"></script>
</body>
</html>
