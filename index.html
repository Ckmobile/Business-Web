<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Web Clone</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="#25D366"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.6-1.28 1.16-1.76 1.2-.45.05-.9.24-3.02-.63-2.56-1.05-4.2-3.63-4.33-3.8-.13-.17-1.03-1.37-1.03-2.6 0-1.24.65-1.84.88-2.1.22-.24.5-.3.66-.3.17 0 .33 0 .48.01.15.01.36-.06.56.43.22.53.74 1.83.8 1.97.07.13.11.3.02.48-.09.17-.13.28-.26.43-.13.15-.28.34-.4.46-.13.13-.27.28-.12.55.15.28.68 1.12 1.46 1.82 1 .9 1.85 1.18 2.12 1.31.28.13.44.11.6-.06.17-.18.7-.82.89-1.1.19-.28.37-.23.62-.14.26.1 1.63.77 1.9.91.28.14.46.2.53.32.07.12.07.66-.15 1.26z"/></svg>
      <h1>WhatsApp Web Clone</h1>
      <p>A professional real-time chat app powered by Firebase</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" class="btn-primary">Log in</button>
      <p class="auth-error" id="loginError"></p>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <label class="avatar-picker">
        <input type="file" id="signupAvatar" accept="image/*" hidden />
        <div class="avatar-preview" id="avatarPreview">+</div>
        <span>Add photo</span>
      </label>
      <input type="text" id="signupName" placeholder="Your name" required />
      <input type="email" id="signupEmail" placeholder="Email" required autocomplete="username" />
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password" />
      <button type="submit" class="btn-primary">Create account</button>
      <p class="auth-error" id="signupError"></p>
    </form>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="appScreen" class="app-screen hidden">

  <!-- ---------- SIDEBAR ---------- -->
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-header">
      <img id="myAvatar" class="avatar" src="" alt="Me" />
      <div class="sidebar-header-actions">
        <button id="newGroupBtn" title="New group" class="icon-btn">👥</button>
        <button id="newChatBtn" title="New chat" class="icon-btn">💬</button>
        <button id="themeToggleBtn" title="Toggle theme" class="icon-btn">🌙</button>
        <button id="logoutBtn" title="Log out" class="icon-btn">⏻</button>
      </div>
    </header>

    <div class="sidebar-search">
      <input type="text" id="chatSearchInput" placeholder="Search or start new chat" />
    </div>

    <ul class="chat-list" id="chatList">
      <!-- chat items injected here -->
    </ul>
  </aside>

  <!-- ---------- CHAT PANEL ---------- -->
  <main class="chat-panel">
    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 303 172" width="260"><path fill="#dad7cb" d="M229.32 132.06c-4.1 0-8.02-1.61-11.02-4.52l-49.1-47.7-49.1 47.7c-3 2.91-6.92 4.52-11.02 4.52-8.68 0-15.72-7.04-15.72-15.72V50.66c0-8.68 7.04-15.72 15.72-15.72 4.1 0 8.02 1.61 11.02 4.52l49.1 47.7 49.1-47.7c3-2.91 6.92-4.52 11.02-4.52 8.68 0 15.72 7.04 15.72 15.72v65.68c0 8.68-7.04 15.72-15.72 15.72z"/></svg>
      <h2>WhatsApp Web Clone</h2>
      <p>Select a chat to start messaging, or search for someone to start a new conversation.</p>
    </div>

    <div id="chatView" class="chat-view hidden">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn mobile-only">←</button>
        <img id="chatAvatar" class="avatar" src="" alt="" />
        <div class="chat-header-info">
          <h3 id="chatTitle">—</h3>
          <p id="chatSubtitle">—</p>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" id="searchInChatBtn" title="Search in chat">🔍</button>
        </div>
      </header>

      <div class="messages" id="messagesContainer"></div>

      <div class="attach-preview hidden" id="attachPreview">
        <span id="attachFileName"></span>
        <div class="progress-bar"><div id="attachProgress" class="progress-bar-fill"></div></div>
        <button id="cancelAttachBtn" class="icon-btn">✕</button>
      </div>

      <footer class="chat-input-bar">
        <button id="emojiBtn" class="icon-btn" title="Emoji">😊</button>
        <div id="emojiPicker" class="emoji-picker hidden"></div>
        <button id="attachBtn" class="icon-btn" title="Attach file">📎</button>
        <input type="file" id="fileInput" hidden />
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" />
        <button id="sendBtn" class="icon-btn send-btn" title="Send">➤</button>
      </footer>
    </div>
  </main>
</div>

<!-- ===================== NEW CHAT MODAL ===================== -->
<div id="newChatModal" class="modal hidden">
  <div class="modal-card">
    <header><h3>New chat</h3><button class="icon-btn close-modal" data-modal="newChatModal">✕</button></header>
    <input type="text" id="newChatSearch" placeholder="Search by name" />
    <ul id="newChatResults" class="user-results"></ul>
  </div>
</div>

<!-- ===================== NEW GROUP MODAL ===================== -->
<div id="newGroupModal" class="modal hidden">
  <div class="modal-card">
    <header><h3>New group</h3><button class="icon-btn close-modal" data-modal="newGroupModal">✕</button></header>
    <input type="text" id="groupNameInput" placeholder="Group name" />
    <input type="text" id="groupSearch" placeholder="Add participants" />
    <div id="groupSelectedChips" class="chips"></div>
    <ul id="groupResults" class="user-results"></ul>
    <button id="createGroupBtn" class="btn-primary">Create group</button>
  </div>
</div>

<!-- ===================== IMAGE VIEWER MODAL ===================== -->
<div id="imageViewerModal" class="modal image-viewer hidden">
  <button class="icon-btn close-modal" data-modal="imageViewerModal">✕</button>
  <img id="imageViewerImg" src="" alt="" />
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
