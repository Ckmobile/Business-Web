div><div class="pcard fade-in" style="animation-delay:.05s"><div class="pcard-header"><div class="pcard-header-icon pink"><i class="fas fa-lock"></i></div><h3>Change Password</h3></div><div class="pcard-body"><div class="form-group"><label class="form-label">Current Password</label><div class="input-wrap"><input class="form-input" id="currentPwInput" placeholder="Enter current password" type="password"/><button class="eye-btn" onclick="toggleEye('currentPwInput',this)" type="button"><i class="fas fa-eye"></i></button></div></div><div class="form-group"><label class="form-label">New Password</label><div class="input-wrap"><input class="form-input" id="newPwInput" placeholder="Min. 8 characters" type="password"/><button class="eye-btn" onclick="toggleEye('newPwInput',this)" type="button"><i class="fas fa-eye"></i></button></div></div><div class="form-group"><label class="form-label">Confirm New Password</label><div class="input-wrap"><input class="form-input" id="confirmPwInput" placeholder="Repeat new password" type="password"/><button class="eye-btn" onclick="toggleEye('confirmPwInput',this)" type="button"><i class="fas fa-eye"></i></button></div></div><div class="alert" id="pwAlert"></div><button class="btn btn-primary btn-full" id="changePwBtn" onclick="changePassword()"><i class="fas fa-key"></i> Update Password </button><div class="divider">or</div><div style="text-align:center; margin-bottom:4px;"><small style="color:var(--gray); font-size:12px;">Forgot your password?</small></div><button class="btn btn-ghost btn-full" id="forgotPwBtn" onclick="sendForgotPassword()"><i class="fas fa-envelope"></i> Send Password Reset Email </button><div class="alert" id="forgotAlert"></div></div></div><div class="pcard fade-in" id="ordersCard" style="animation-delay:.10s"><div class="pcard-header"><div class="pcard-header-icon teal"><i class="fas fa-shopping-bag"></i></div><h3>My Orders</h3></div><div class="pcard-body" id="ordersList"><div class="orders-empty"><i class="fas fa
