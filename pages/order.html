<header class="checkout-header"><div class="checkout-header-inner"><div class="checkout-title"><i class="fas fa-bag-shopping"></i> Confirm Your Order</div><nav aria-label="Checkout progress" class="checkout-steps"><span class="step done"><i class="fas fa-check"></i><span class="step-label">Cart</span></span><span class="step-line"></span><span class="step active"><span class="step-label">Confirm</span></span></nav><span class="secure-badge"><i class="fas fa-lock"></i><span class="badge-label">Secure Checkout</span></span></div></header><div class="order-page"><div class="order-item-card"><div class="order-item-image"><img alt="Product image" id="itemImage" src=""/></div><div class="order-item-info"><h2 id="itemName">Item Name</h2><div class="order-item-meta"><span class="meta-chip"><i class="fas fa-tag"></i><span id="itemCategory">Category</span></span><span class="meta-chip price"><i class="fas fa-money-bill-wave"></i> LKR <span id="itemPrice">0.00</span></span></div><p class="desc" id="itemDescription">Description will appear here.</p><div class="qty-row"><span class="qty-label">Quantity</span><div class="qty-selector"><button aria-label="Decrease quantity" class="qty-btn" id="qtyMinus" type="button">−</button><span class="qty-value" id="qtyValue">1</span><button aria-label="Increase quantity" class="qty-btn" id="qtyPlus" type="button">+</button></div></div><div class="total-row">Total: LKR <span class="total-amount" id="totalPrice">0.00</span></div></div></div><div class="order-form-card"><h3><i class="fas fa-user-edit"></i> Your Details</h3><div id="errorBox"></div><form id="orderForm" novalidate=""><div class="form-group"><label for="customerName">Full Name <span style="color:var(--danger)">*</span></label><div class="input-wrap"><i class="fas fa-user"></i><input autocomplete="name" id="customerName" maxlength="60" placeholder="Your full name" required="" type="text"/></div></div><div class="form-group"><label for="customerPhone">Phone Number <span style="color:var(--danger)">*</span></label><div class="input-wrap"><i class="fas fa-phone"></i><input autocomplete="tel" id="customerPhone" inputmode="numeric" maxlength="10" pattern="[0-9]{9,10}" placeholder="07X XXX XXXX" required="" type="tel"/></div><div class="hint"><i class="fas fa-info-circle"></i> 9 or 10 digit phone number</div></div><div class="form-group"><label for="customerAddress">Delivery Address <span style="color:var(--gray);font-weight:400">(Optional)</span></label><div class="input-wrap"><i class="fas fa-map-marker-alt"></i> <textarea autocomplete="street-address" id="customerAddress" maxlength="250" placeholder="Street, City, Postal code…" rows="2"></textarea> </div></div><div class="form-group"><label for="customerMessage">Additional Notes <span style="color:var(--gray);font-weight:400">(Optional)</span></label><div class="input-wrap"><i class="fas fa-comment-dots"></i> <textarea id="customerMessage" maxlength="300" placeholder="Special requests, size preference, colour…" rows="2"></textarea> </div></div><div class="order-actions"><button class="btn btn-cancel" id="cancelBtn" type="button"><i class="fas fa-times"></i> Cancel </button><button class="btn btn-confirm" id="confirmBtn" type="submit"><span class="btn-spinner"></span><span class="btn-label"><i class="fas fa-clipboard-check"></i> Confirm Order</span></button></div></form></div></div><div class="success-overlay" id="successOverlay"><div class="success-box"><div class="success-icon-wrap"><i class="fas fa-check"></i></div><h3>Order Placed! 🎉</h3><p>Your order for <strong id="successItemName"></strong> has been received.</p><p>Quantity: <strong id="successQty"></strong>  |  Total: LKR <strong id="successTotal"></strong></p><p>Our team will contact you on <strong id="successPhone"></strong> shortly.</p><div class="success-order-id" id="successOrderRef"></div><div id="successBtnArea" style="display:flex;flex-direction:column;gap:10px;margin-top:4px;"></div></div></div>
